# Build, package and smoke-test both agents for one release.
#
# Called by release.yml and nightly.yml, never on its own: it has no trigger
# but workflow_call. It is read-only (contents: read) and signs, attests and
# publishes nothing, so the callers' signing jobs are the only place their
# identities are used; GitHub caps a called workflow's token at what the
# calling job grants, which here is contents: read.
#
#   build    one leg per target in release/agents.json, on a GitHub-hosted
#            runner of the target where CGO needs one (the sensor on Linux
#            and macOS), cross-compiled with CGO off otherwise. Each leg runs
#            scripts/build.sh with AGENT_VERSION from the release, -trimpath,
#            and uploads only the executable.
#   package  checks every binary's build information, generates
#            THIRD_PARTY_LICENSES, the SBOMs and the packages
#            (scripts/release/package.mjs).
#   smoke    unpacks the Linux packages on linux/amd64 and linux/arm64 runners
#            and runs each agent and its installer's dependency check
#            (scripts/release/smoke.sh). Only what this job executed may be
#            called runtime_qualified.
#
# scripts/release-metadata.test.mjs fails when the matrices below disagree
# with release/agents.json.
name: Build agents

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z, vX.Y.Z-rc.N or nightly-YYYYMMDD-<12 hex>)
        required: true
        type: string
      version:
        description: The version stamped into main.Version
        required: true
        type: string
      source-time:
        description: Committer time of the commit being built, RFC 3339 UTC
        required: true
        type: string
      require-notices:
        description: Fail when LICENSE or NOTICE is missing (tagged releases)
        required: true
        type: boolean

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: go1.26.10
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  NODE_VERSION: '24'

jobs:
  build:
    name: build (${{ matrix.agent }} ${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - {agent: sensor, os: linux, arch: amd64, runner: ubuntu-24.04}
          - {agent: sensor, os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {agent: sensor, os: darwin, arch: amd64, runner: macos-15-intel}
          - {agent: sensor, os: darwin, arch: arm64, runner: macos-14}
          - {agent: sensor, os: windows, arch: amd64, runner: ubuntu-24.04}
          - {agent: sensor, os: windows, arch: '386', runner: ubuntu-24.04}
          - {agent: device-agent, os: linux, arch: amd64, runner: ubuntu-24.04}
          - {agent: device-agent, os: linux, arch: arm64, runner: ubuntu-24.04}
          - {agent: device-agent, os: darwin, arch: amd64, runner: ubuntu-24.04}
          - {agent: device-agent, os: darwin, arch: arm64, runner: ubuntu-24.04}
          - {agent: device-agent, os: windows, arch: amd64, runner: ubuntu-24.04}
    env:
      AGENT: ${{ matrix.agent }}
      TARGET: ${{ matrix.os }}-${{ matrix.arch }}
      AGENT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install libpcap-dev (the Linux sensor links libpcap)
        if: matrix.agent == 'sensor' && matrix.os == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpcap-dev
      # The sensor on macOS links the system libpcap through the SDK the
      # runner image carries; nothing to install.
      - name: Build
        run: scripts/build.sh "$AGENT" "$TARGET"
      - name: Stage the executable
        run: |
          exe=$(jq -r --arg k "$AGENT" '.agents[] | select(.kind == $k) | .executable' release/agents.json)
          [ "${TARGET%%-*}" != windows ] || exe="$exe.exe"
          mkdir -p "$RUNNER_TEMP/out"
          cp "dist/$AGENT/$TARGET/$exe" "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-${{ matrix.agent }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3

  package:
    name: package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds
      - name: Package
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_TIME: ${{ inputs.source-time }}
          REQUIRE_NOTICES: ${{ inputs.require-notices }}
        run: |
          args=(--builds "$RUNNER_TEMP/builds" --tag "$TAG" --source-sha "$GITHUB_SHA" --source-time "$SOURCE_TIME"
                --out "$RUNNER_TEMP/assets" --state "$RUNNER_TEMP/state")
          [ "$REQUIRE_NOTICES" != true ] || args+=(--require-notices)
          node scripts/release/package.mjs "${args[@]}"
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-state
          path: ${{ runner.temp }}/state/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.os }}/${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      # The libpcap RUNTIME only, as a customer host has it; the sensor must
      # load without the development package.
      - name: Install the libpcap runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpcap0.8t64
      - name: Smoke-run the packaged agents
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          scripts/release/smoke.sh "$RUNNER_TEMP/assets" "$VERSION" "$RUNNER_TEMP/smoke/smoke-${{ matrix.os }}-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: error
          retention-days: 7
