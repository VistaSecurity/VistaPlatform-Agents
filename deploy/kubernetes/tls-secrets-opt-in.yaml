# OPTIONAL. Lets the device agent read the certificates stored in Secrets of
# type kubernetes.io/tls. Apply it only if you want certificates that are
# stored in the cluster but not served by anything; every certificate that is
# served is found without it.
#
#   kubectl apply -f tls-secrets-opt-in.yaml
#   kubectl -n vista-agents rollout restart deployment/vista-device-agent
#
# Read this before applying. Kubernetes cannot grant "the certificate but not
# the key", and cannot grant "only Secrets of type kubernetes.io/tls":
# permission to list Secrets is permission to read every Secret, keys
# included, wherever this role is bound. What limits the agent is the agent:
# it asks the API server for TLS Secrets only (a field selector, so no other
# Secret is sent to it), reads the tls.crt and ca.crt entries, and never
# decodes tls.key. If that is not enough for you, do not apply this file.
#
# To limit it to some namespaces, delete the ClusterRoleBinding below and bind
# the ClusterRole with a RoleBinding in each namespace instead:
#
#   kubectl -n <namespace> create rolebinding vista-device-agent-tls-secrets \
#     --clusterrole=vista-device-agent-tls-secrets \
#     --serviceaccount=vista-agents:vista-device-agent
#
# To turn it off again: kubectl delete -f tls-secrets-opt-in.yaml, then restart
# the deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vista-device-agent-tls-secrets
  labels:
    app.kubernetes.io/part-of: vista-agents
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vista-device-agent-tls-secrets
  labels:
    app.kubernetes.io/part-of: vista-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vista-device-agent-tls-secrets
subjects:
  - kind: ServiceAccount
    name: vista-device-agent
    namespace: vista-agents
---
# The setting that tells the agent to use the permission above. Without it the
# agent never calls the Secrets API, whatever it is permitted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vista-device-agent-options
  namespace: vista-agents
  labels:
    app.kubernetes.io/part-of: vista-agents
data:
  VISTA_KUBERNETES_READ_TLS_SECRETS: "true"
