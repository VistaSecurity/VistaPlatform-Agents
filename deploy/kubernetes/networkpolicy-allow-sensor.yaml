# OPTIONAL. Admits the sensor's scans into a namespace that denies ingress by
# default. Apply it in each such namespace you want scanned:
#
#   kubectl -n <namespace> apply -f networkpolicy-allow-sensor.yaml
#
# Without it, a default-deny namespace looks to the sensor like nothing is
# listening, and the platform reports its Services as blocked by network
# policy rather than as scanned. It admits the sensor's pods and nothing else,
# on every port, because finding listeners nobody declared is part of the
# scan. Remove it with kubectl -n <namespace> delete networkpolicy
# allow-vista-sensor-scan.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vista-sensor-scan
  labels:
    app.kubernetes.io/part-of: vista-agents
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vista-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vista-sensor
